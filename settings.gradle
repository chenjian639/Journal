pluginManagement {
	repositories {
		maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
		gradlePluginPortal()
		mavenCentral()
	}
}

plugins {
	// Allows Gradle toolchains to auto-provision JDKs (e.g., Java 21) when not installed locally.
	id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'paper-master'
