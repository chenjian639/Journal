# ====== PaperMaster 应用配置 ======
spring.application.name=paper-master

# 服务器配置
server.address=0.0.0.0
server.port=9090

# 编码配置 - 解决中文乱码
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.mandatory-file-encoding=UTF-8

# 文件上传配置
spring.servlet.multipart.max-file-size=1000MB
spring.servlet.multipart.max-request-size=1000MB

# ====== 关键词翻译模式（控制落库/展示的 top_keywords 语言） ======
# off      : 不翻译（保持原文，可能是中文）
# glossary : 仅使用 python/keyword_glossary_clean.json 查表翻译（离线、快；未命中仍保留中文）
# baidu    : 未命中时调用百度翻译（联网、慢，受额度影响）
papermaster.keywordTranslateMode=glossary

# ====== 数据库选择（手动切换） ======
# 你要求的“只改一个文件就切库”的方式：
# - 默认启用 SQLite（db 文件：paper.db）
# - 需要用 MySQL 时：把【MySQL】块取消注释，并把【SQLite】块注释掉
#
# 注意：如果你同时开启两套 spring.datasource.*，后面的会覆盖前面的，容易引起混乱。

# ====== 数据源配置（SQLite：本地 db 文件）===== 
spring.datasource.url=jdbc:sqlite:paper.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# ====== JPA/Hibernate（SQLite） ======
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ====== 数据源配置（MySQL：生产/部署）===== 
# 取消注释以启用 MySQL，并按需修改连接信息。
#spring.datasource.url=jdbc:mysql://127.0.0.1:3306/papermaster?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
#spring.datasource.username=root
#spring.datasource.password=your_password
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ====== JPA/Hibernate（MySQL） ======
#spring.jpa.hibernate.ddl-auto=none
#spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
