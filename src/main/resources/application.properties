#spring.jpa.open-in-view=false

# ====== AI服务配置 (DeepSeek/OpenAI Compatible) ======
# AI API配置
# 如果不需要AI功能，可以留空，系统会自动禁用AI相关功能
ai.api.base-url=https://ark.cn-beijing.volces.com/api/v3
ai.api.key=16e8a1d3-013b-49f0-8a83-5c591956ad7d
ai.api.model=deepseek-v3-2-251201
ai.api.timeout=60

# AI提示词文件路径（不需要修改）
ai.prompt.journal-detail=classpath:prompts/journal_detail_system.txt
ai.prompt.recommend-match=classpath:prompts/recommend_match_system.txt

# ====== 日志配置 ======
# 开发环境显示详细日志，生产环境设为WARN
logging.level.root=INFO
logging.level.com.paper=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ====== 开发工具配置 ======
# 开启开发者工具（热部署）
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
