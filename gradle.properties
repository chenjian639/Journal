# Gradle 配置文件
# 设置编码为 UTF-8，解决中文乱码问题
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Dsun.stdout.encoding=UTF-8 -Dsun.stderr.encoding=UTF-8

# 启用并行构建
org.gradle.parallel=true

# 启用缓存
org.gradle.caching=true

# 避免在国内网络环境下卡在 Foojay/Disco 的 JDK Toolchain 下载。
# 建议：本机安装对应版本的 JDK，并设置 JAVA_HOME（或 JDK_HOME）。
# 如确实需要自动下载，可改回 true（或在命令行加 -Dorg.gradle.java.installations.auto-download=true）。
org.gradle.java.installations.auto-download=false

# 让 Gradle 优先从本机已安装 JDK / 环境变量中发现可用的 Java。
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.fromEnv=JAVA_HOME,JDK_HOME

# 项目使用的目标 Java 版本（同时用于 toolchain 与 --release）。
# 如你本机只有 JDK 17，可先改成 17 以跳过 JDK 21 的下载。
javaVersion=21
